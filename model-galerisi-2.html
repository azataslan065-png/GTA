<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>Yalıkent — model atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#080a12;--paper:#ece9e1;--teal:#3fe0c0;--amber:#e8a33d;--dim:#8b91a8;
  --sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:'Saira Condensed',system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

#kunye{position:fixed;z-index:4;top:calc(var(--st) + 12px);right:calc(var(--sr) + 14px);
  text-align:right;max-width:42vw;pointer-events:none}
#adi{font-size:25px;line-height:1.02;letter-spacing:.01em}
#kunye dl{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6}
#kunye dt{display:inline;color:var(--dim)}
#kunye dd{display:inline;margin-left:5px}
#kunye dd::after{content:"";display:block}

#basli{position:fixed;z-index:4;top:calc(var(--st) + 12px);left:calc(var(--sl) + 14px)}
#basli h1{font-size:18px;font-weight:700;letter-spacing:.02em;line-height:1}
#tohum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-top:3px}

#turler{position:fixed;z-index:4;left:calc(var(--sl) + 14px);top:50%;
  transform:translateY(-50%);display:flex;flex-direction:column;gap:1px}
#turler button{width:56px;padding:9px 0;font-size:13px;letter-spacing:.04em;
  background:rgba(11,13,22,.72);border:1px solid rgba(236,233,225,.14);color:var(--dim)}
#turler button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);
  color:#0b1a18;font-weight:700}

/* Üç satır tek sütunda: daha önce ayrı ayrı sabitlenmişlerdi ve
   varyant şeridi iki satıra taşınca direksiyon sürgüsüyle çakışıyordu. */
#altbar{position:fixed;z-index:4;left:0;right:0;bottom:calc(var(--sb) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:0 calc(var(--sr) + 10px) 0 calc(var(--sl) + 76px)}
#oynatma{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
#oynatma .grup{display:flex;gap:1px}
#oynatma .grup button{padding:7px 12px;font-size:12px;background:rgba(11,13,22,.75);
  border:1px solid rgba(236,233,225,.14);color:var(--dim)}
#oynatma .grup button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);
  color:#141726;font-weight:700}
#direksiyon{display:flex;align-items:center;gap:8px;background:rgba(11,13,22,.75);
  border:1px solid rgba(236,233,225,.14);padding:6px 10px}
#direksiyon label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
#direksiyon input{width:112px;accent-color:var(--teal)}
.kapali{display:none !important}

#serit{display:flex;gap:5px;justify-content:flex-start;flex-wrap:nowrap;
  max-width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#serit::-webkit-scrollbar{display:none}
#serit button{flex:0 0 auto}
#serit button{padding:5px 10px;font-size:12px;background:rgba(11,13,22,.72);
  border:1px solid rgba(236,233,225,.14);color:var(--dim)}
#serit button[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}

#araclar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#araclar button{padding:8px 15px;font-size:13px;letter-spacing:.05em;
  border:1px solid rgba(236,233,225,.28)}
#araclar button.ana{background:var(--amber);color:#141726;border-color:var(--amber);font-weight:700}

#ipucu{position:fixed;z-index:4;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);transition:opacity .6s}
#ipucu.gizle{opacity:0}
#yukle{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
  background:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.3em;color:var(--dim)}
#yukle.bitti{display:none}
@media (max-height:420px){ #adi{font-size:19px} #altbar{gap:5px}
  #serit button{padding:4px 8px;font-size:11px} }
</style>
</head>
<body>

<div id="basli"><h1>Model atölyesi</h1><div id="tohum">s3 · tohum —</div></div>
<div id="kunye"><div id="adi">—</div><dl id="kunyeler"></dl></div>
<div id="ipucu">sürükle: döndür · iki parmak: yakınlaş</div>

<nav id="turler" aria-label="Model türü">
  <button data-tur="bina" aria-pressed="false">Bina</button>
  <button data-tur="arac" aria-pressed="true">Araç</button>
  <button data-tur="insan" aria-pressed="false">İnsan</button>
</nav>

<div id="altbar">
<div id="oynatma">
  <div class="grup kapali" id="hareket">
    <button data-mod="dur">Dur</button>
    <button data-mod="yuru" aria-pressed="true">Yürü</button>
    <button data-mod="kos">Koş</button>
  </div>
  <div class="grup" id="surus">
    <button data-surus="durgun" aria-pressed="true">Park</button>
    <button data-surus="hareket">Tekerlek dönsün</button>
  </div>
  <div id="direksiyon">
    <label for="dirInput">direksiyon</label>
    <input id="dirInput" type="range" min="-100" max="100" value="0">
  </div>
</div>

<div id="serit" role="group" aria-label="Varyantlar"></div>

<div id="araclar">
  <button class="ana" id="yeniSeri">Yeni seri üret</button>
  <button id="hepsi" aria-pressed="false">Hepsini diz</button>
  <button id="dondur" aria-pressed="true">Dönüşü durdur</button>
</div>
</div>

<div id="yukle">Modeller kuruluyor</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const yukleEl=document.getElementById("yukle");
if(!window.THREE){ yukleEl.textContent="three.js yüklenemedi"; return; }

/* ═════════════ temel yardımcılar ═════════════ */
let _s=1;
/* Tohumu dağıt ve ısıt: ham xorshift ardışık tohumlarda neredeyse aynı ilk
   değeri veriyor, o zaman bütün modeller tek kalıptan çıkıyor. */
const tohumla=n=>{ _s=(Math.imul((n>>>0)||1,2654435761)>>>0)||1; for(let i=0;i<16;i++) r(); };
function r(){ _s^=_s<<13; _s>>>=0; _s^=_s>>17; _s^=_s<<5; _s>>>=0; return _s/4294967296; }
const rn=(a,b)=>a+r()*(b-a);
const ri=(a,b)=>Math.floor(rn(a,b+1));
const sec=a=>a[Math.floor(r()*a.length)];
const secAg=(a,w)=>{ let t=0; for(const x of w)t+=x; let k=r()*t;
  for(let i=0;i<a.length;i++){ k-=w[i]; if(k<=0) return a[i]; } return a[a.length-1]; };
const kis=(v,a,b)=>v<a?a:v>b?b:v;

/* Alt yüzü bw×bd, üst yüzü tw×td olan kesik prizma. Araba camlığı, çatı
   saçağı, insan gövdesi — kutu yığını görüntüsünden kurtaran tek şey bu. */
function prizma(bw,bd,tw,td,h,kx,kz){
  kx=kx||0; kz=kz||0;
  const bx=bw/2,bz=bd/2,tx=tw/2,tz=td/2;
  const v=[-bx,0,-bz, bx,0,-bz, bx,0,bz, -bx,0,bz,
           kx-tx,h,kz-tz, kx+tx,h,kz-tz, kx+tx,h,kz+tz, kx-tx,h,kz+tz];
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(v,3));
  g.setIndex([0,1,2, 0,2,3, 4,6,5, 4,7,6, 0,4,5, 0,5,1,
              1,5,6, 1,6,2, 2,6,7, 2,7,3, 3,7,4, 3,4,0]);
  g.computeVertexNormals(); return g;
}
const kutu=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const silindir=(rt,rb,h,n)=>new THREE.CylinderGeometry(rt,rb,h,n);
function mat(renk,puruz,metal){
  return new THREE.MeshStandardMaterial({color:renk,
    roughness:puruz===undefined?.82:puruz,metalness:metal===undefined?.04:metal});
}
function parca(ust,geo,m,x,y,z,rx,ry,rz){
  const me=new THREE.Mesh(geo,m);
  me.position.set(x||0,y||0,z||0);
  if(rx||ry||rz) me.rotation.set(rx||0,ry||0,rz||0);
  me.castShadow=true; me.receiveShadow=true;
  ust.add(me); return me;
}
const grup=(ust,x,y,z)=>{ const g=new THREE.Group(); g.position.set(x||0,y||0,z||0);
  ust.add(g); return g; };
function tuval(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h;
  return {c,x:c.getContext("2d")}; }
function doku(c,tx,ty,saydam){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(tx||1,ty||1);
  if(!saydam) t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4; return t;
}
const hex=s=>parseInt(s.slice(1),16);

/* ═════════════ paletler ═════════════ */
const CEPHE=[
  {ad:"kireç beyazı",   govde:"#d9d3c6",seri:"#b9b2a2",kolon:"#6f5a4c",dogr:"#2a2f3c"},
  {ad:"kum sarısı",     govde:"#cbb894",seri:"#a8916c",kolon:"#7b4a32",dogr:"#33291f"},
  {ad:"gri beton",      govde:"#9aa0a8",seri:"#7b828c",kolon:"#3f4652",dogr:"#20242e"},
  {ad:"tuğla kırmızısı",govde:"#a55a48",seri:"#8a4335",kolon:"#5c2f26",dogr:"#241a18"},
  {ad:"deniz mavisi",   govde:"#9db6c4",seri:"#7b96a6",kolon:"#3a4c58",dogr:"#1e2730"},
  {ad:"fıstık yeşili",  govde:"#b3bf9b",seri:"#93a07c",kolon:"#4d5940",dogr:"#232a1e"},
  {ad:"toprak kahve",   govde:"#a98d74",seri:"#8a7059",kolon:"#4f3a2c",dogr:"#241c15"}
];
const ARAC_RENK=[
  {ad:"vizon",h:0xbfae99},{ad:"beyaz",h:0xe6e3dc},{ad:"gece mavisi",h:0x24365e},
  {ad:"bordo",h:0x7a2f34},{ad:"gümüş",h:0xa9aeb6},{ad:"antrasit",h:0x33383f},
  {ad:"yosun yeşili",h:0x3c5a46},{ad:"kiremit",h:0xb4593a},{ad:"buz mavisi",h:0x8fa9bd},
  {ad:"hardal",h:0xc9a23c}
];
const TEN=[0xf2dcc4,0xe8c6a6,0xd9ab86,0xc0906c,0x9d7050,0x7c5539];
const SAC=[0x241a12,0x100d0b,0x46301f,0x6b5136,0x9a7a45,0xb9b3ad,0x7a4326];
const UST=[0x1b1d22,0x2f4a6b,0x7a2f34,0x3c5a46,0xd9d3c6,0x4a3f5c,0xc9702f,0x2b6b6b,0x8a8f99];
const ALT=[0x2f3a52,0x3c4152,0x22252c,0x5a4a38,0x6b7180,0x1d2733];
const AYAKKABI=[0x1a1a1e,0x2e2419,0xe0ddd6,0x3a3f4a];
const TENTE=[0xb4593a,0x2b6b6b,0xc9a23c,0x7a2f34,0x3c5a46,0xd9d3c6];

/* ═════════════ dokular ═════════════ */
/* Yüz artık geometri değil doku. Sebep: oyunda yayalar tek InstancedMesh'te
   çizilecek; göz-kaş-ağız ayrı mesh olsaydı kişi başına on çizim daha gelirdi.
   Doku tabanı beyaz, böylece malzeme rengi ten rengini veriyor. */
function yuzDoku(sakal,kasKalin,agiz){
  const {c,x:g}=tuval(256,256);
  g.fillStyle="#ffffff"; g.fillRect(0,0,256,256);
  /* küre UV'sinde ön yüz u≈0.25, göz hizası v≈0.63 */
  const mx=64, my=256-Math.round(.63*256);
  if(sakal){
    g.fillStyle="rgba(58,42,30,.55)";
    g.beginPath(); g.ellipse(mx,my+34,30,26,0,0,Math.PI*2); g.fill();
    g.fillStyle="#ffffff";
    g.beginPath(); g.ellipse(mx,my+20,17,11,0,0,Math.PI*2); g.fill();
  }
  [-15,15].forEach(dx=>{
    g.fillStyle="#f4efe6";
    g.beginPath(); g.ellipse(mx+dx,my,8.5,5,0,0,Math.PI*2); g.fill();
    g.fillStyle="#22303c";
    g.beginPath(); g.arc(mx+dx,my,4.1,0,Math.PI*2); g.fill();
    g.fillStyle="#0c1116";
    g.beginPath(); g.arc(mx+dx,my,1.9,0,Math.PI*2); g.fill();
    g.strokeStyle="rgba(40,28,20,.65)"; g.lineWidth=1.6;
    g.beginPath(); g.ellipse(mx+dx,my,8.5,5,0,Math.PI,Math.PI*2); g.stroke();
  });
  g.strokeStyle="#3a2a1c"; g.lineWidth=kasKalin; g.lineCap="round";
  [-15,15].forEach(dx=>{ g.beginPath();
    g.moveTo(mx+dx-9,my-11); g.quadraticCurveTo(mx+dx,my-14.5,mx+dx+9,my-10); g.stroke(); });
  g.strokeStyle="rgba(120,85,60,.42)"; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(mx,my+3); g.lineTo(mx-2.5,my+15); g.lineTo(mx+3,my+16); g.stroke();
  g.strokeStyle="#7a4038"; g.lineWidth=2.6; g.beginPath();
  if(agiz==="gulen") g.arc(mx,my+21,9,.25,Math.PI-.25);
  else { g.moveTo(mx-8,my+25); g.lineTo(mx+8,my+25); }
  g.stroke();
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
const YUZ_ADI=["sakalsız","sakallı","gülen","sakallı gülen","kalın kaşlı","ince kaşlı"];
const YUZLER=[];
tohumla(7);
[[false,3.0,"duz"],[true,3.4,"duz"],[false,2.4,"gulen"],
 [true,2.8,"gulen"],[false,3.8,"duz"],[false,2.6,"duz"]]
  .forEach(a=>YUZLER.push(yuzDoku(a[0],a[1],a[2])));

/* Lastik: dikey dişler. Düz silindir dönerken hiç dönüyormuş gibi durmuyordu. */
const LASTIK_DOKU=(()=>{ const {c,x:g}=tuval(64,64);
  g.fillStyle="#181a1f"; g.fillRect(0,0,64,64);
  g.fillStyle="#0d0f12";
  for(let i=0;i<8;i++) g.fillRect(i*8,0,4,64);
  g.fillStyle="#262a31"; g.fillRect(0,0,64,3); g.fillRect(0,61,64,3);
  return doku(c,9,1); })();
/* Jant: kollu göbek. Tekerleğin döndüğünü gösteren asıl işaret bu. */
function jantDoku(kolSayisi){
  const {c,x:g}=tuval(128,128);
  g.fillStyle="#14161b"; g.fillRect(0,0,128,128);
  g.fillStyle="#b9bec6"; g.beginPath(); g.arc(64,64,58,0,Math.PI*2); g.fill();
  g.fillStyle="#2b3038";
  for(let i=0;i<kolSayisi;i++){
    const a=i/kolSayisi*Math.PI*2;
    g.save(); g.translate(64,64); g.rotate(a);
    g.beginPath(); g.moveTo(-6,-14); g.lineTo(6,-14); g.lineTo(11,-54); g.lineTo(-11,-54);
    g.closePath(); g.fill(); g.restore();
  }
  g.fillStyle="#d2d6dc"; g.beginPath(); g.arc(64,64,15,0,Math.PI*2); g.fill();
  g.fillStyle="#7d838c"; g.beginPath(); g.arc(64,64,7,0,Math.PI*2); g.fill();
  return doku(c);
}
const JANTLAR=[jantDoku(5),jantDoku(6),jantDoku(8),jantDoku(10)];
const JANT_ADI=["5 kollu","6 kollu","8 kollu","10 kollu"];

function cepheDoku(p,pencereSayisi,balkonlu){
  const {c,x:g}=tuval(256,256);
  g.fillStyle=p.govde; g.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){ g.fillStyle="rgba(0,0,0,"+(r()*.05)+")"; g.fillRect(r()*256,r()*256,3,3); }
  g.fillStyle=p.seri; g.fillRect(0,0,256,14); g.fillRect(0,242,256,14);
  const n=pencereSayisi,bo=256/n,gen=bo*.46,yuk=112;
  for(let i=0;i<n;i++){
    const px=i*bo+(bo-gen)/2, py=76;
    g.fillStyle=p.dogr; g.fillRect(px-4,py-4,gen+8,yuk+8);
    const gr=g.createLinearGradient(px,py,px,py+yuk);
    gr.addColorStop(0,"#39485c"); gr.addColorStop(.55,"#1d2530"); gr.addColorStop(1,"#2b3340");
    g.fillStyle=gr; g.fillRect(px,py,gen,yuk);
    g.fillStyle="rgba(255,255,255,.10)";
    g.beginPath(); g.moveTo(px,py+yuk); g.lineTo(px+gen,py); g.lineTo(px+gen,py+yuk*.3); g.fill();
    g.fillStyle=p.dogr; g.fillRect(px+gen/2-2,py,4,yuk);
  }
  if(balkonlu){ g.fillStyle="rgba(0,0,0,.22)"; g.fillRect(0,58,256,10); }
  return doku(c);
}
function pencereIsik(n){
  const {c,x:g}=tuval(256,256);
  g.fillStyle="#000"; g.fillRect(0,0,256,256);
  const bo=256/n,gen=bo*.46;
  for(let i=0;i<n;i++){ if(r()<.42) continue;
    g.fillStyle=sec(["#ffd9a0","#ffc06a","#cfe6ff","#ffe9c4","#ffb45e"]);
    g.fillRect(i*bo+(bo-gen)/2,76,gen,112); }
  return doku(c);
}
function korkulukDoku(tip){
  const {c,x:g}=tuval(128,64);
  g.clearRect(0,0,128,64);
  g.strokeStyle="#1c2028"; g.lineWidth=5;
  g.beginPath(); g.moveTo(0,4); g.lineTo(128,4); g.stroke();
  g.beginPath(); g.moveTo(0,60); g.lineTo(128,60); g.stroke();
  if(tip==="dikey"){ g.lineWidth=3;
    for(let x=6;x<128;x+=10){ g.beginPath(); g.moveTo(x,4); g.lineTo(x,60); g.stroke(); } }
  else if(tip==="cam"){ g.fillStyle="rgba(150,185,205,.30)"; g.fillRect(0,6,128,52);
    g.lineWidth=4; g.beginPath(); g.moveTo(64,4); g.lineTo(64,60); g.stroke(); }
  else { g.lineWidth=3;
    for(let x=-64;x<128;x+=16){
      g.beginPath(); g.moveTo(x,60); g.lineTo(x+40,4); g.stroke();
      g.beginPath(); g.moveTo(x,4); g.lineTo(x+40,60); g.stroke(); } }
  return doku(c,1,1,true);
}
const KORKULUK={}; ["dikey","cam","baklava"].forEach(k=>KORKULUK[k]=korkulukDoku(k));

/* Tabela: kurum yapılarını birbirinden ayıran asıl şey. */
function tabelaDoku(yazi,zemin,murekkep,ikon){
  const {c,x:g}=tuval(512,128);
  g.fillStyle=zemin; g.fillRect(0,0,512,128);
  g.fillStyle="rgba(0,0,0,.16)"; g.fillRect(0,110,512,18);
  let x0=24;
  if(ikon){
    g.save(); g.translate(60,64);
    if(ikon==="arti"){ g.fillStyle=murekkep; g.fillRect(-28,-9,56,18); g.fillRect(-9,-28,18,56); }
    else if(ikon==="hilal"){ g.fillStyle=murekkep;
      g.beginPath(); g.arc(0,0,28,0,Math.PI*2); g.fill();
      g.fillStyle=zemin; g.beginPath(); g.arc(9,0,23,0,Math.PI*2); g.fill(); }
    else if(ikon==="yildiz"){ g.fillStyle=murekkep; g.beginPath();
      for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=(i%2)?11:28;
        if(i) g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); else g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
      g.closePath(); g.fill(); }
    else if(ikon==="fincan"){ g.fillStyle=murekkep;
      g.beginPath(); g.moveTo(-18,-16); g.lineTo(18,-16); g.lineTo(10,20); g.lineTo(-10,20);
      g.closePath(); g.fill(); g.fillRect(-24,22,48,6); }
    g.restore(); x0=104;
  }
  g.fillStyle=murekkep;
  g.font="700 62px 'Saira Condensed', sans-serif";
  g.textBaseline="middle";
  g.fillText(yazi,x0,66);
  return doku(c);
}

/* ═════════════ BİNALAR ═════════════ */
const BALKON=["yok","ön cephe","köşe","şaşırtmalı","tam cephe"];
const ZEMIN=["dükkân","kolonlu giriş","garaj","bahçe duvarı"];
const CATI=["geniş saçak","korkuluklu teras","eğimli"];
const camMat=()=>new THREE.MeshStandardMaterial({color:0x1d3440,roughness:.10,metalness:.5});
function isikliMat(t,guc){
  return new THREE.MeshStandardMaterial({map:t,emissiveMap:t,
    emissive:new THREE.Color(0xffffff),emissiveIntensity:guc,roughness:.7});
}
function tabelaEkle(g,en,y,z,yazi,zemin,murekkep,ikon,genOran){
  const t=tabelaDoku(yazi,zemin,murekkep,ikon);
  const w=en*(genOran||.62);
  parca(g,kutu(w,w/4,.18),isikliMat(t,.4),0,y,z);
}
function bayrakDiregi(g,x,z,yuk){
  parca(g,silindir(.07,.09,yuk,8),mat(0xd7dade,.5,.3),x,yuk/2,z);
  parca(g,kutu(1.5,1.0,.04),mat(0xc8102e,.9),x+.78,yuk-.75,z);
  parca(g,kutu(.34,.34,.05),mat(0xf2efe6,.9),x+.72,yuk-.75,z+.01);
}
function kaldirim(g,en,boy){ parca(g,kutu(en+5,.16,boy+5),mat(0x8e9199,.96),0,.08,0); }

/* ── apartman ── */
function apartman(){
  const kat=ri(3,7), en=rn(9.5,15), boy=rn(9,14), p=sec(CEPHE);
  const balkon=secAg(BALKON,[1,3,2,2,1.4]);
  const zeminTip=secAg(ZEMIN,[3,2,1.5,1]);
  const catiTip=sec(CATI), kork=sec(["dikey","cam","baklava"]);
  const katY=rn(2.9,3.2), pen=en>12?4:3;
  const g=new THREE.Group(); kaldirim(g,en,boy);
  const zY=katY*1.05, gY=kat*katY;

  const cd=cepheDoku(p,pen,balkon!=="yok"); cd.repeat.set(2,kat);
  const isik=pencereIsik(pen); isik.repeat.set(2,kat);
  parca(g,kutu(en,gY,boy),new THREE.MeshStandardMaterial({map:cd,emissiveMap:isik,
    emissive:new THREE.Color(0xffb765),emissiveIntensity:.5,roughness:.88}),0,zY+gY/2,0);

  const kolonM=mat(hex(p.kolon),.95), kg=rn(.9,1.5);
  [[-en/2+kg/2,-boy/2+kg/2],[en/2-kg/2,-boy/2+kg/2],
   [-en/2+kg/2,boy/2-kg/2],[en/2-kg/2,boy/2-kg/2]].forEach(c=>
    parca(g,kutu(kg,zY+gY,kg),kolonM,c[0],(zY+gY)/2,c[1]));

  if(balkon!=="yok"){
    const derin=rn(1.5,2.1), slabM=mat(0xe8e4da,.9);
    const yuzler=["z+"];
    if(balkon==="köşe"||balkon==="tam cephe") yuzler.push("x+");
    if(balkon==="tam cephe") yuzler.push("z-");
    for(let k=0;k<kat;k++){
      if(balkon==="şaşırtmalı"&&k%2===1) continue;
      const by=zY+k*katY+.08;
      for(const yz of yuzler){
        const yatay=(yz==="x+");
        const gen=(yatay?boy:en)*rn(.44,.6), kay=rn(-.1,.1)*(yatay?boy:en);
        const dx=yatay?en/2+derin/2:kay;
        const dz=yz==="z+"?boy/2+derin/2:(yz==="z-"?-boy/2-derin/2:kay);
        parca(g,kutu(yatay?derin:gen,.22,yatay?gen:derin),slabM,dx,by,dz);
        const kt=KORKULUK[kork].clone();
        kt.repeat.set(Math.max(1,Math.round(gen/1.6)),1); kt.needsUpdate=true;
        const km=new THREE.MeshStandardMaterial({map:kt,transparent:true,alphaTest:.28,
          side:THREE.DoubleSide,roughness:.6,metalness:.25});
        if(yz==="z+") parca(g,new THREE.PlaneGeometry(gen,1.05),km,dx,by+.62,dz+derin/2);
        if(yz==="z-") parca(g,new THREE.PlaneGeometry(gen,1.05),km,dx,by+.62,dz-derin/2);
        if(yz==="x+") parca(g,new THREE.PlaneGeometry(gen,1.05),km,dx+derin/2,by+.62,dz,0,Math.PI/2,0);
      }
    }
  }

  parca(g,kutu(en*.98,zY,boy*.98),mat(hex(p.dogr),.8),0,zY/2,0);
  if(zeminTip==="dükkân"){
    parca(g,kutu(en*.72,zY*.62,.25),camMat(),0,zY*.52,boy/2+.05);
    const t=parca(g,prizma(en*.78,2.1,en*.78,.35,.1),mat(sec(TENTE),.9),0,zY*.92,boy/2+1.0);
    t.rotation.x=-.28;
  } else if(zeminTip==="kolonlu giriş"){
    for(let i=-1;i<=1;i++) parca(g,silindir(.28,.32,zY,10),mat(0xdedacd,.9),i*en*.3,zY/2,boy/2-.4);
  } else if(zeminTip==="garaj"){
    parca(g,kutu(en*.44,zY*.7,.22),mat(0x4a4640,.85),-en*.2,zY*.42,boy/2+.04);
    parca(g,kutu(1.1,zY*.8,.2),mat(0x6b4a32,.85),en*.26,zY*.45,boy/2+.04);
  } else {
    parca(g,kutu(en*1.04,1.1,.3),mat(hex(p.seri),.95),0,.6,boy/2+.9);
    parca(g,kutu(en*.9,.5,boy*.3),mat(0x3d6b45,.98),0,.35,boy/2+.45);
  }

  const tepe=zY+gY;
  if(catiTip==="geniş saçak"){
    parca(g,kutu(en+1.7,.45,boy+1.7),mat(hex(p.seri),.9),0,tepe+.22,0);
    parca(g,kutu(en+1.1,.22,boy+1.1),mat(0x2a2f3a,.9),0,tepe+.52,0);
  } else if(catiTip==="korkuluklu teras"){
    parca(g,kutu(en,.2,boy),mat(0x6f7480,.95),0,tepe+.1,0);
    const pm=mat(hex(p.govde),.9);
    parca(g,kutu(en,.85,.3),pm,0,tepe+.55,boy/2-.15);
    parca(g,kutu(en,.85,.3),pm,0,tepe+.55,-boy/2+.15);
    parca(g,kutu(.3,.85,boy),pm,en/2-.15,tepe+.55,0);
    parca(g,kutu(.3,.85,boy),pm,-en/2+.15,tepe+.55,0);
  } else parca(g,prizma(en+1.2,boy+1.2,en*.2,boy*.2,1.9),mat(0x7a3f32,.95),0,tepe,0);

  const mk=rn(2.2,3.2);
  parca(g,kutu(mk,1.9,mk),mat(hex(p.dogr),.9),rn(-.2,.2)*en,tepe+1.2,rn(-.2,.2)*boy);
  if(r()<.7){ const dm=mat(0xcfd3d8,.6,.3);
    for(let i=0;i<ri(1,3);i++)
      parca(g,silindir(.5,.5,1.0,12),dm,rn(-.3,.3)*en,tepe+.75,rn(-.3,.3)*boy,0,0,Math.PI/2); }

  return {g,ad:kat+" katlı apartman",yuk:tepe+3,cap:Math.max(en,boy),
    kunye:[["kat",kat],["cephe",p.ad],["balkon",balkon],["zemin",zeminTip],
           ["çatı",catiTip],["taban",Math.round(en)+"×"+Math.round(boy)+" m"]]};
}

/* ── dükkân sırası ── */
function dukkanlar(){
  const adet=ri(3,5), birim=rn(4.6,5.6), boy=rn(7,9), en=adet*birim;
  const g=new THREE.Group(); kaldirim(g,en,boy);
  const yuk=rn(4.2,5.0), p=sec(CEPHE);
  parca(g,kutu(en,yuk,boy),mat(hex(p.govde),.9),0,yuk/2,0);
  parca(g,kutu(en+.5,.4,boy+.5),mat(hex(p.seri),.9),0,yuk+.2,0);
  const ADLAR=["Manav","Fırın","Kuaför","Kırtasiye","Bakkal","Tuhafiye","Lokanta","Kasap","Nalbur"];
  const TABELA_ZEMIN=["#b4593a","#2b6b6b","#c9a23c","#7a2f34","#3c5a46","#2f4a6b"];
  const isimler=[];
  for(let i=0;i<adet;i++){
    const cx=(i-(adet-1)/2)*birim;
    const ad=ADLAR[ri(0,ADLAR.length-1)]; isimler.push(ad);
    parca(g,kutu(birim*.84,2.3,.3),camMat(),cx,1.5,boy/2+.06);
    parca(g,kutu(.9,2.1,.16),mat(hex(p.dogr),.8),cx+birim*.36,1.35,boy/2+.1);
    const t=tabelaDoku(ad,sec(TABELA_ZEMIN),"#f2efe6",null);
    parca(g,kutu(birim*.9,.72,.14),isikliMat(t,.55),cx,3.15,boy/2+.12);
    const tente=parca(g,prizma(birim*.88,1.8,birim*.88,.3,.1),mat(sec(TENTE),.92),cx,2.75,boy/2+.9);
    tente.rotation.x=-.3;
  }
  return {g,ad:"Dükkân sırası",yuk:yuk+2,cap:en,
    kunye:[["dükkân",adet],["cephe",p.ad],["işletmeler",isimler.join(", ")]]};
}

/* ── eczane ── */
function eczane(){
  const en=rn(8,11), boy=rn(8,10), kat=ri(1,2), katY=3.4, yuk=kat*katY;
  const g=new THREE.Group(); kaldirim(g,en,boy);
  parca(g,kutu(en,yuk,boy),mat(0xeceae2,.9),0,yuk/2,0);
  parca(g,kutu(en+.4,.35,boy+.4),mat(0x2f7d55,.85),0,yuk+.18,0);
  parca(g,kutu(en*.74,2.5,.3),camMat(),0,1.55,boy/2+.06);
  parca(g,kutu(1.0,2.3,.18),mat(0x2f7d55,.7),en*.32,1.45,boy/2+.1);
  tabelaEkle(g,en,yuk*.88,boy/2+.12,"ECZANE","#f2efe6","#2f7d55","arti",.66);
  /* yeşil haç direği: sokağın öbür ucundan okunan işaret */
  const hacM=new THREE.MeshStandardMaterial({color:0x3fbe74,
    emissive:new THREE.Color(0x3fbe74),emissiveIntensity:1.4,roughness:.4});
  parca(g,silindir(.08,.08,1.4,8),mat(0xb9bec6,.5,.4),-en/2+.5,yuk*.62,boy/2+.7);
  parca(g,kutu(1.1,.34,.18),hacM,-en/2+.5,yuk*.62+.7,boy/2+.7);
  parca(g,kutu(.34,1.1,.18),hacM,-en/2+.5,yuk*.62+.7,boy/2+.7);
  if(kat===2) parca(g,kutu(en*.8,1.3,.16),camMat(),0,katY+1.6,boy/2+.06);
  return {g,ad:"Eczane",yuk:yuk+2,cap:Math.max(en,boy),

           ["taban",Math.round(en)+"×"+Math.round(boy)+" m"]]};
}

/* ── hastane ── */
function hastane(){
  const en=rn(22,30), boy=rn(14,18), kat=ri(4,6), katY=3.5, yuk=kat*katY;
  const g=new THREE.Group(); kaldirim(g,en,boy);
  const cd=cepheDoku({govde:"#e4e6e4",seri:"#b9c0c2",kolon:"#7d868a",dogr:"#2b333a"},6,false);
  cd.repeat.set(3,kat);
  const isik=pencereIsik(6); isik.repeat.set(3,kat);
  parca(g,kutu(en,yuk,boy),new THREE.MeshStandardMaterial({map:cd,emissiveMap:isik,
    emissive:new THREE.Color(0xcfe6ff),emissiveIntensity:.6,roughness:.85}),0,yuk/2,0);
  parca(g,kutu(en*.5,4.4,4.5),mat(0xd8dcdc,.9),0,2.2,boy/2+2.2);
  parca(g,kutu(en*.42,2.6,.3),camMat(),0,1.6,boy/2+4.5);
  /* acil kanopisi */
  parca(g,kutu(en*.36,.35,4.2),mat(0xc23b3b,.85),-en*.22,4.2,boy/2+3.4);
  [-1,1].forEach(s=>parca(g,silindir(.16,.18,4.0,10),mat(0xb9bec6,.6,.3),
    -en*.22+s*en*.15,2.0,boy/2+5.2));
  tabelaEkle(g,en,5.3,boy/2+4.7,"HASTANE","#ffffff","#c23b3b","hilal",.40);
  parca(g,kutu(en,.3,boy),mat(0x9aa0a4,.95),0,yuk+.15,0);
  for(let i=0;i<3;i++) parca(g,kutu(2.6,1.3,2.6),mat(0x8c9398,.9),
    (i-1)*en*.25,yuk+.8,rn(-.2,.2)*boy);
  /* helikopter dairesi */
  const hM=mat(0xf2efe6,.9);
  parca(g,silindir(4.2,4.2,.12,28),mat(0x6f767c,.95),en*.25,yuk+.35,-boy*.2);
  parca(g,kutu(2.6,.14,.7),hM,en*.25,yuk+.42,-boy*.2);
  parca(g,kutu(.7,.14,3.4),hM,en*.25-.95,yuk+.42,-boy*.2);
  parca(g,kutu(.7,.14,3.4),hM,en*.25+.95,yuk+.42,-boy*.2);
  return {g,ad:"Hastane",yuk:yuk+3,cap:Math.max(en,boy),
    kunye:[["kat",kat],["acil kanopisi","var"],["helikopter pisti","var"],
           ["taban",Math.round(en)+"×"+Math.round(boy)+" m"]]};
}

/* ── karakol ── */
function karakol(){
  const en=rn(13,17), boy=rn(10,13), kat=2, katY=3.4, yuk=kat*katY;
  const g=new THREE.Group(); kaldirim(g,en,boy);
  parca(g,kutu(en,yuk,boy),mat(0xd6d2c6,.9),0,yuk/2,0);
  /* lacivert kuşak: karakolu tek bakışta ayıran şey */
  parca(g,kutu(en+.16,.9,boy+.16),mat(0x1f4e8c,.8),0,katY-.3,0);
  parca(g,kutu(en+.5,.4,boy+.5),mat(0x8e9199,.9),0,yuk+.2,0);
  parca(g,kutu(3.2,2.7,.3),mat(0x2b333a,.7),0,1.35,boy/2+.06);
  [-1,1].forEach(s=>parca(g,kutu(en*.22,1.9,.2),camMat(),s*en*.28,1.9,boy/2+.06));
  tabelaEkle(g,en,yuk*.86,boy/2+.12,"KARAKOL","#1f4e8c","#f2efe6","yildiz",.60);
  bayrakDiregi(g,-en/2+1.2,boy/2+1.6,7.5);
  parca(g,kutu(4.6,.22,1.6),mat(0xb9b2a2,.95),0,.22,boy/2+.9);
  parca(g,kutu(4.6,.22,1.0),mat(0xb9b2a2,.95),0,.44,boy/2+.55);
  /* bariyer */
  parca(g,silindir(.14,.16,1.1,8),mat(0x8e9199,.6,.3),en*.28,.55,boy/2+3.0);
  const kol=parca(g,kutu(5.0,.16,.16),mat(0xd94c4c,.85),en*.28+2.4,1.05,boy/2+3.0);
  parca(g,kutu(4.6,.17,.17),mat(0xf2efe6,.85),en*.28+2.4,1.05,boy/2+3.0);
  kol.scale.set(1,1.05,1.05);
  /* çatı: anten ve tepe lambası */
  parca(g,silindir(.05,.06,3.2,6),mat(0x8e9199,.6,.4),en*.3,yuk+1.8,0);
  parca(g,kutu(.6,.26,.6),new THREE.MeshStandardMaterial({color:0x2a7cff,
    emissive:new THREE.Color(0x2a7cff),emissiveIntensity:2.2,roughness:.4}),-en*.3,yuk+.6,0);
  return {g,ad:"Karakol",yuk:yuk+4,cap:Math.max(en,boy)+6,
    kunye:[["kat",kat],["kuşak","lacivert"],["bayrak direği","var"],["bariyer","var"]]};
}

/* ── market ── */

  const marka=sec([["#d9463c","#f7f4ec"],["#1f6b3a","#f7f4ec"],
                   ["#f0a500","#22252c"],["#1f4e8c","#f7f4ec"]]);

  for(let i=0;i<5;i++) parca(g,kutu(.22,3.2,.32),mat(0xb9bec6,.5,.3),(i-2)*en*.17,1.9,boy/2+.09);

}

/* ── cami ── */
function cami(){
  const en=rn(15,19), boy=rn(15,19), govdeY=rn(6.5,8);
  const g=new THREE.Group(); kaldirim(g,en,boy);
  const tas=mat(0xd8d2c2,.92), kursun=mat(0x6f8f96,.6,.25), altin=mat(0xc9a23c,.4,.7);
  parca(g,kutu(en,govdeY,boy),tas,0,govdeY/2,0);
  parca(g,kutu(en+.6,.45,boy+.6),mat(0x8a8377,.9),0,govdeY+.22,0);
  const kubbeR=Math.min(en,boy)*.36;
  parca(g,silindir(kubbeR*1.06,kubbeR*1.06,.9,24),tas,0,govdeY+.9,0);
  parca(g,new THREE.SphereGeometry(kubbeR,24,14,0,Math.PI*2,0,Math.PI/2),
    kursun,0,govdeY+1.35,0);
  parca(g,silindir(.09,.11,1.5,8),altin,0,govdeY+1.35+kubbeR+.7,0);
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(s=>{
    const kr=kubbeR*.36;
    parca(g,new THREE.SphereGeometry(kr,16,10,0,Math.PI*2,0,Math.PI/2),
      kursun,s[0]*en*.34,govdeY+.45,s[1]*boy*.34);
  });
  /* minare */
  const minY=govdeY*2.3, mx=-en/2-1.2, mz=boy/2+1.2;
  parca(g,silindir(.55,.75,minY,12),tas,mx,minY/2,mz);
  parca(g,silindir(.95,.95,.5,12),mat(0xc4bdac,.9),mx,minY*.62,mz);
  parca(g,silindir(.42,.55,minY*.22,12),tas,mx,minY+minY*.11,mz);
  parca(g,new THREE.ConeGeometry(.55,1.8,12),kursun,mx,minY+minY*.22+.9,mz);
  parca(g,silindir(.06,.07,.9,8),altin,mx,minY+minY*.22+2.2,mz);
  /* son cemaat yeri */
  for(let i=-2;i<=2;i++) parca(g,silindir(.3,.34,3.4,10),tas,i*en*.19,1.7,boy/2+1.6);
  parca(g,kutu(en*.92,.5,3.4),tas,0,3.6,boy/2+1.6);
  parca(g,kutu(2.2,2.6,.25),mat(0x6b4a32,.8),0,1.3,boy/2+.1);
  return {g,ad:"Cami",yuk:minY+4,cap:Math.max(en,boy)+6,
    kunye:[["kubbe çapı",(kubbeR*2).toFixed(1)+" m"],["minare",minY.toFixed(1)+" m"],
           ["revak","5 sütun"],["yarım kubbe",4]]};
}

/* ── benzinlik ── */
function benzinlik(){
  const en=rn(16,20), boy=rn(12,15);
  const g=new THREE.Group();
  parca(g,kutu(en+8,.14,boy+8),mat(0x53575e,.97),0,.07,0);
  const marka=sec([["#d9463c","#f7f4ec"],["#1f6b3a","#f7f4ec"],["#f0a500","#22252c"]]);
  parca(g,kutu(en*.5,4.2,boy*.42),mat(0xe8e6de,.9),-en*.24,2.1,-boy*.28);
  parca(g,kutu(en*.36,2.4,.3),camMat(),-en*.24,1.5,-boy*.07+.06);
  parca(g,kutu(en*.52,.9,boy*.44),mat(hex(marka[0]),.8),-en*.24,4.5,-boy*.28);
  const kanY=5.4;
  parca(g,kutu(en,.7,boy*.62),mat(0xf2efe6,.85),en*.15,kanY,boy*.12);
  parca(g,kutu(en+.3,.35,boy*.64),mat(hex(marka[0]),.8),en*.15,kanY-.5,boy*.12);
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(s=>
    parca(g,kutu(.7,kanY-.35,.7),mat(0xdedad0,.9),
      en*.15+s[0]*en*.4,(kanY-.35)/2,boy*.12+s[1]*boy*.22));
  for(let i=0;i<2;i++){
    const px=en*.15+(i?1:-1)*en*.18;
    parca(g,kutu(.5,.3,3.4),mat(0x6f767c,.9),px,.15,boy*.12);
    parca(g,kutu(1.0,1.9,.9),mat(0xf2efe6,.8),px,1.25,boy*.12);
    parca(g,kutu(.75,.55,.06),new THREE.MeshStandardMaterial({color:0x1b2028,
      emissive:new THREE.Color(0x3fe0c0),emissiveIntensity:.9,roughness:.4}),px,1.75,boy*.12+.48);
    parca(g,kutu(1.1,.2,1.0),mat(hex(marka[0]),.8),px,2.3,boy*.12);
  }
  parca(g,silindir(.2,.24,5.5,8),mat(0xb9bec6,.6,.3),en*.55,2.75,-boy*.4);
  const t=tabelaDoku("BENZİN",marka[0],marka[1],null);
  parca(g,kutu(2.6,2.0,.2),isikliMat(t,.65),en*.55,6.0,-boy*.4);
  return {g,ad:"Benzinlik",yuk:9,cap:en+8,
    kunye:[["pompa",2],["kanopi","var"],["market","var"],["totem","fiyat panosu"]]};
}

/* ── kahvehane ── */
function kahvehane(){
  const en=rn(8,11), boy=rn(7,9), yuk=rn(3.6,4.2);
  const g=new THREE.Group(); kaldirim(g,en,boy);
  const p=sec(CEPHE);
  parca(g,kutu(en,yuk,boy),mat(hex(p.govde),.92),0,yuk/2,0);
  parca(g,kutu(en+.4,.35,boy+.4),mat(hex(p.seri),.9),0,yuk+.18,0);
  parca(g,kutu(en*.7,2.2,.3),camMat(),0,1.45,boy/2+.06);
  tabelaEkle(g,en,yuk*.86,boy/2+.12,"KIRAATHANE","#2b4a3f","#e8c98a","fincan",.82);
  const tenteR=sec(TENTE);
  const tente=parca(g,prizma(en*.96,2.6,en*.96,.3,.12),mat(tenteR,.92),0,yuk*.74,boy/2+1.3);
  tente.rotation.x=-.26;
  /* dışarıda masa ve tabure */
  const masaSayisi=ri(2,4);
  for(let i=0;i<masaSayisi;i++){
    const mx=rn(-en*.35,en*.35), mz=boy/2+rn(1.8,3.2);
    parca(g,silindir(.42,.42,.06,14),mat(0xf2efe6,.85),mx,.72,mz);
    parca(g,silindir(.06,.08,.72,8),mat(0x6f767c,.6,.3),mx,.36,mz);
    for(let k=0;k<3;k++){ const a=k/3*Math.PI*2+rn(0,1);
      parca(g,silindir(.19,.19,.06,10),mat(tenteR,.9),mx+Math.cos(a)*.85,.46,mz+Math.sin(a)*.85);
      parca(g,silindir(.05,.05,.46,6),mat(0x6f767c,.6,.3),
        mx+Math.cos(a)*.85,.23,mz+Math.sin(a)*.85); }
  }
  return {g,ad:"Kahvehane",yuk:yuk+3,cap:Math.max(en,boy)+7,
    kunye:[["tip","tek kat"],["tente","#"+tenteR.toString(16)],
           ["dış masa",masaSayisi],["cephe",p.ad]]};
}

/* ═════════════ ARAÇLAR ═════════════
   Araçlar +Z'ye bakar. Tekerlek geometrisi X eksenine yatırıldı: dönüş
   teker.rotation.x, direksiyon ise üst yuvanın rotation.y'si oluyor. */
const ARAC_SINIF=[
  {id:"hatchback",ad:"Hatchback",uz:3.92,en:1.74,yerden:.16,govdeY:.62,
   kabinUz:.50,kabinY:.70,kabinKay:-.04,ustOran:.60,arka:"kesik",ray:false,kaplama:false,jantR:.31},
  {id:"crossover",ad:"Crossover",uz:4.14,en:1.82,yerden:.26,govdeY:.70,
   kabinUz:.48,kabinY:.78,kabinKay:-.04,ustOran:.62,arka:"kesik",ray:true,kaplama:true,jantR:.35},
  {id:"sedan",ad:"Sedan",uz:4.62,en:1.78,yerden:.14,govdeY:.60,
   kabinUz:.42,kabinY:.62,kabinKay:-.10,ustOran:.52,arka:"bagajlı",ray:false,kaplama:false,jantR:.32},
  {id:"minibus",ad:"Minibüs",uz:5.10,en:1.92,yerden:.22,govdeY:.74,
   kabinUz:.74,kabinY:1.12,kabinKay:.02,ustOran:.92,arka:"dik",ray:true,kaplama:false,jantR:.34},
  {id:"kamyonet",ad:"Kamyonet",uz:4.86,en:1.88,yerden:.30,govdeY:.72,
   kabinUz:.32,kabinY:.82,kabinKay:.24,ustOran:.80,arka:"kasa",ray:false,kaplama:true,jantR:.37},
  {id:"panelvan",ad:"Panelvan",uz:4.70,en:1.86,yerden:.20,govdeY:.72,
   kabinUz:.68,kabinY:1.06,kabinKay:.08,ustOran:.90,arka:"dik",ray:false,kaplama:false,jantR:.34},
  {id:"taksi",ad:"Taksi",uz:4.55,en:1.78,yerden:.14,govdeY:.60,
   kabinUz:.44,kabinY:.64,kabinKay:-.09,ustOran:.54,arka:"bagajlı",ray:false,kaplama:false,jantR:.32}
];

function tekerlekYap(ust,x,y,z,R,genislik,jantDok){
  const yuva=grup(ust,x,y,z);                       /* direksiyon ekseni */
  const lg=silindir(R,R,genislik,24); lg.rotateZ(Math.PI/2);
  const lm=new THREE.MeshStandardMaterial({map:LASTIK_DOKU.clone(),roughness:.95});
  lm.map.repeat.set(9,1); lm.map.needsUpdate=true;
  const teker=parca(yuva,lg,lm,0,0,0);              /* dönüş ekseni */
  const jg=silindir(R*.64,R*.64,genislik*1.06,20); jg.rotateZ(Math.PI/2);
  parca(teker,jg,new THREE.MeshStandardMaterial({map:jantDok,roughness:.35,metalness:.6}),0,0,0);
  return {yuva,teker};
}

function aracUret(id){
  const s=id?ARAC_SINIF.find(x=>x.id===id):sec(ARAC_SINIF);
  const taksi=s.id==="taksi";
  const boya=taksi?{ad:"taksi sarısı",h:0xe8b32a}:sec(ARAC_RENK);
  const jantIdx=Math.floor(r()*JANTLAR.length);
  const g=new THREE.Group();
  const uz=s.uz*rn(.98,1.02), en=s.en, R=s.jantR;
  const tabanY=s.yerden+R*.55;
  const boyaM=new THREE.MeshStandardMaterial({color:boya.h,roughness:.28,metalness:.6});
  const camM=new THREE.MeshStandardMaterial({color:0x0e131b,roughness:.08,metalness:.5});
  const siyahM=mat(0x1a1d24,.85), kromM=mat(0xb9bec6,.25,.85);

  parca(g,prizma(en*.94,uz,en,uz*.97,s.govdeY),boyaM,0,tabanY,0);
  parca(g,kutu(en*.9,.2,uz*.99),siyahM,0,tabanY+.05,0);

  const kUz=uz*s.kabinUz, kY=s.kabinY, kayZ=uz*s.kabinKay, ustUz=kUz*s.ustOran;
  parca(g,prizma(en*.96,kUz,en*.80,ustUz,kY,0,-kUz*.05),camM,0,tabanY+s.govdeY,kayZ);
  parca(g,kutu(en*.81,.08,ustUz*1.02),boyaM,0,tabanY+s.govdeY+kY,kayZ-kUz*.05);
  /* A ve C direkleri: dört köşede ince ve eğik.
     Önceki hâlleri kabin boyunca uzanan tam duvarlardı, camları kapatıyordu. */
  const dirK=.075, ustZ0=kayZ-kUz*.05;
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(p=>{
    const sx=p[0], sz=p[1];
    const altX=sx*en*.47, altZ=kayZ+sz*(kUz/2-.05);
    const ustX=sx*en*.385, ustZ=ustZ0+sz*(ustUz/2-.05);
    parca(g,prizma(dirK,.17,dirK,.17,kY,ustX-altX,ustZ-altZ),boyaM,
      altX,tabanY+s.govdeY,altZ);
  });

  if(s.arka==="bagajlı")
    parca(g,prizma(en*.96,uz*.28,en*.92,uz*.26,.28),boyaM,0,tabanY+s.govdeY,-uz*.34);
  if(s.arka==="kasa"){
    const kz=uz*.40;
    parca(g,kutu(en*.96,.5,kz),boyaM,0,tabanY+s.govdeY+.2,-uz*.25);
    [-1,1].forEach(sx=>parca(g,kutu(.11,.42,kz),boyaM,sx*en*.47,tabanY+s.govdeY+.62,-uz*.25));
    parca(g,kutu(en*.96,.42,.11),boyaM,0,tabanY+s.govdeY+.62,-uz*.25-kz/2);
  }
  if(s.id==="panelvan")
    [-1,1].forEach(sx=>parca(g,kutu(.06,kY*.82,kUz*.5),boyaM,
      sx*en*.47,tabanY+s.govdeY+kY*.45,kayZ-kUz*.2));

  const dingil=uz*.32, tekZ=en*.5-.02;
  const on1=tekerlekYap(g,-tekZ,R, dingil,R,.24,JANTLAR[jantIdx]);
  const on2=tekerlekYap(g, tekZ,R, dingil,R,.24,JANTLAR[jantIdx]);
  const ar1=tekerlekYap(g,-tekZ,R,-dingil,R,.24,JANTLAR[jantIdx]);
  const ar2=tekerlekYap(g, tekZ,R,-dingil,R,.24,JANTLAR[jantIdx]);
  if(s.kaplama) [dingil,-dingil].forEach(dz=>[-1,1].forEach(sx=>
    parca(g,kutu(.16,.30,R*2.5),siyahM,sx*(en*.5+.02),R*1.5,dz)));

  const farM=new THREE.MeshStandardMaterial({color:0xfff4d8,
    emissive:new THREE.Color(0xfff0cc),emissiveIntensity:1.2,roughness:.2});
  const stopM=new THREE.MeshStandardMaterial({color:0xff3546,
    emissive:new THREE.Color(0xff2a3c),emissiveIntensity:.9,roughness:.3});
  [-1,1].forEach(sx=>parca(g,kutu(.46,.20,.14),farM,sx*en*.28,tabanY+s.govdeY*.62,uz/2-.04));
  const stopG=s.arka==="dik"?kutu(.20,.48,.12):kutu(.42,.22,.12);
  [-1,1].forEach(sx=>parca(g,stopG,stopM,sx*en*.32,tabanY+s.govdeY*.66,-uz/2+.04));
  parca(g,kutu(en*.52,.20,.10),kromM,0,tabanY+s.govdeY*.38,uz/2-.02);
  parca(g,kutu(en*.98,.26,.22),siyahM,0,tabanY+.14, uz/2-.09);
  parca(g,kutu(en*.98,.26,.22),siyahM,0,tabanY+.14,-uz/2+.09);
  [-1,1].forEach(sx=>{
    const my=tabanY+s.govdeY+kY*.28, mz=kayZ+kUz*.40;
    parca(g,kutu(.10,.045,.05),siyahM,sx*(en*.48),my,mz);       /* sap */
    parca(g,kutu(.17,.11,.07),siyahM,sx*(en*.52+.05),my,mz);    /* ayna */
  });
  if(s.ray) [-1,1].forEach(sx=>parca(g,kutu(.09,.07,ustUz*.82),siyahM,
    sx*en*.30,tabanY+s.govdeY+kY+.07,kayZ-kUz*.05));
  if(taksi){
    parca(g,kutu(.30,.22,.7),mat(0xf2efe6,.7),0,tabanY+s.govdeY+kY+.16,kayZ);
    [-1,1].forEach(sx=>parca(g,kutu(.03,.16,uz*.5),mat(0x1b1d22,.8),
      sx*(en/2+.01),tabanY+s.govdeY*.5,0));
  }
  if(s.id==="minibus"||s.id==="panelvan")
    parca(g,kutu(.06,kY*.9,.06),siyahM,en*.48,tabanY+s.govdeY+kY*.5,kayZ);

  g.userData={ad:s.ad,tur:"arac",yukseklik:tabanY+s.govdeY+kY+.5,capi:uz,
    tekerler:[on1,on2,ar1,ar2],onTekerler:[on1,on2],tekerR:R,
    kunye:[["sınıf",s.ad],["renk",boya.ad],["uzunluk",uz.toFixed(2)+" m"],
           ["jant",JANT_ADI[jantIdx]],["yerden",s.yerden.toFixed(2)+" m"],
           ["arka",s.arka],["tavan rayı",s.ray?"var":"yok"]]};
  return g;
}

/* ═════════════ İNSANLAR ═════════════
   İskelet: kalça → uyluk → baldır → ayak, gövde → üst kol → ön kol.
   Diz ve dirsek olmadan hiçbir yürüyüş insana benzemiyor. */
const UST_GIYSI=["tişört","kazak","gömlek","mont","ceket","yelek"];
const UST_AG=[2.6,2.4,1.9,1.3,1.3,.7];
const SAC_TIP=["kısa","dağınık","topuz","kel","kasket","bere","başörtüsü"];
const SAC_AG=[3.0,2.4,1.2,1.0,1.1,.6,1.5];
const OLCU={ayak:.10,baldir:.35,uyluk:.45,kalca:.90,govde:.50,ustKol:.28,onKol:.26};

function insanUret(){
  const boy=rn(.93,1.09), genis=rn(.90,1.16);
  const ten=sec(TEN), sacR=sec(SAC), ustR=sec(UST), altR=sec(ALT), ayakR=sec(AYAKKABI);
  const ustG=secAg(UST_GIYSI,UST_AG), sacT=secAg(SAC_TIP,SAC_AG);
  const yuzIdx=Math.floor(r()*YUZLER.length);
  const canta=r()<.32;

  const g=new THREE.Group();
  const kok=grup(g,0,0,0); kok.scale.set(genis,boy,genis);
  const tenM=mat(ten,.88), ustM=mat(ustR,.86), altM=mat(altR,.9),
        ayakM=mat(ayakR,.7), sacM=mat(sacR,.95);
  const kolM=(ustG==="tişört"||ustG==="yelek")?tenM:ustM;

  /* ── bacaklar ── */
  const kalca=grup(kok,0,OLCU.kalca,0);
  parca(kalca,prizma(.40,.26,.36,.24,.20),ustG==="mont"?ustM:altM,0,-.16,0);
  const bacak={};
  [["L",-1],["R",1]].forEach(p=>{
    const ad=p[0];
    const uyluk=grup(kalca,p[1]*.105,-.06,0);
    const ug=prizma(.19,.20,.16,.17,OLCU.uyluk); ug.translate(0,-OLCU.uyluk,0);
    parca(uyluk,ug,altM,0,0,0);
    const baldir=grup(uyluk,0,-OLCU.uyluk,0);
    const bg=prizma(.16,.17,.13,.14,OLCU.baldir); bg.translate(0,-OLCU.baldir,0);
    parca(baldir,bg,altM,0,0,0);
    const ayak=grup(baldir,0,-OLCU.baldir,0);
    parca(ayak,prizma(.17,.26,.15,.20,OLCU.ayak,0,.03),ayakM,0,-OLCU.ayak,.05);
    bacak["uyluk"+ad]=uyluk; bacak["baldir"+ad]=baldir; bacak["ayak"+ad]=ayak;
  });

  /* ── gövde ── */
  const govde=grup(kok,0,OLCU.kalca,0);
  parca(govde,prizma(.38,.24,.45,.27,OLCU.govde),ustM,0,0,0);
  if(ustG==="yelek") parca(govde,prizma(.40,.26,.45,.28,OLCU.govde*.78),mat(sec(UST),.86),0,.02,0);
  if(ustG==="gömlek") parca(govde,kutu(.09,.30,.02),mat(0xf0ece2,.8),0,OLCU.govde-.32,.135);
  parca(govde,prizma(.45,.27,.42,.25,.09),ustM,0,OLCU.govde,0);
  parca(govde,silindir(.072,.084,.11,10),tenM,0,OLCU.govde+.08,0);

  /* kafa: yüz dokusu küre UV'sinde ön yüze denk gelir */
  const bas=grup(govde,0,OLCU.govde+.19,0);
  parca(bas,new THREE.SphereGeometry(.115,20,16),
    new THREE.MeshStandardMaterial({color:ten,map:YUZLER[yuzIdx],roughness:.88}),0,.10,0);
  parca(bas,prizma(.055,.05,.03,.03,.05),tenM,0,.085,.105);
  [-1,1].forEach(sx=>{ const k=parca(bas,new THREE.SphereGeometry(.035,8,6),tenM,sx*.112,.10,0);
    k.scale.set(.5,1,.8); });

  if(sacT==="kısa"||sacT==="dağınık"||sacT==="topuz"){
    const s1=parca(bas,new THREE.SphereGeometry(.121,16,12),sacM,0,.115,-.012);
    s1.scale.set(1,sacT==="dağınık"?.86:.76,1.03);
    if(sacT==="topuz") parca(bas,new THREE.SphereGeometry(.072,10,8),sacM,0,.165,-.115);
  } else if(sacT==="kasket"){
    const k=parca(bas,new THREE.SphereGeometry(.124,16,10),mat(sec(UST),.9),0,.115,0);
    k.scale.set(1,.60,1);
    parca(bas,kutu(.21,.028,.13),mat(sec(UST),.9),0,.108,.155);
  } else if(sacT==="bere"){
    const k=parca(bas,new THREE.SphereGeometry(.127,16,12),mat(sec(UST),.95),0,.108,0);
    k.scale.set(1,.84,1);
  } else if(sacT==="başörtüsü"){
    const ortR=sec(UST);
    const k=parca(bas,new THREE.SphereGeometry(.142,16,12),mat(ortR,.9),0,.09,-.012);
    k.scale.set(1,.96,1.02);
    parca(govde,prizma(.26,.17,.19,.11,.22),mat(ortR,.9),0,OLCU.govde+.02,-.02);
  }

  /* ── kollar ── */
  const kol={};
  [["L",-1],["R",1]].forEach(p=>{
    const ad=p[0];
    const ustKol=grup(govde,p[1]*.245,OLCU.govde-.02,0);
    const ug=prizma(.135,.145,.12,.13,OLCU.ustKol); ug.translate(0,-OLCU.ustKol,0);
    parca(ustKol,ug,kolM,0,0,0);
    const onKol=grup(ustKol,0,-OLCU.ustKol,0);
    const og=prizma(.12,.13,.105,.115,OLCU.onKol); og.translate(0,-OLCU.onKol,0);
    parca(onKol,og,(ustG==="mont"||ustG==="ceket")?ustM:tenM,0,0,0);
    const el=parca(onKol,new THREE.SphereGeometry(.055,10,8),tenM,0,-OLCU.onKol-.035,0);
    el.scale.set(.85,1.1,.7);
    kol["ustKol"+ad]=ustKol; kol["onKol"+ad]=onKol;
  });

  if(canta){
    parca(govde,prizma(.26,.15,.24,.13,.30),mat(sec(UST),.9),0,OLCU.govde-.46,-.17);
    parca(govde,kutu(.05,.34,.03),mat(0x2a2f3a,.9),.13,OLCU.govde-.22,-.06);
  }

  const dugum={kok:kok,kalca:kalca,govde:govde,bas:bas};
  for(const k in bacak) dugum[k]=bacak[k];
  for(const k in kol) dugum[k]=kol[k];

  g.userData={ad:ustG[0].toLocaleUpperCase("tr")+ustG.slice(1)+"lü figür",tur:"insan",
    yukseklik:1.90*boy,capi:1.3,dugum:dugum,faz:r()*6.283,salinim:rn(.9,1.12),
    kunye:[["üst giysi",ustG],["saç / başlık",sacT],["boy",(1.76*boy).toFixed(2)+" m"],
           ["yapı",genis<.98?"ince":(genis>1.08?"geniş":"orta")],
           ["yüz",YUZ_ADI[yuzIdx]],["çanta",canta?"var":"yok"]]};
  return g;
}

/* Yürüyüş çevrimi. Faz biriktirilerek ilerliyor — oyundaki eski hâli
   sin(t × hız) kullandığı için hız her değiştiğinde bacaklar sıçrıyordu. */
function insanKare(m,mod,dt){
  const u=m.userData, d=u.dugum;
  const kos=mod==="kos", yuru=mod==="yuru";
  if(!yuru&&!kos){
    u.faz+=dt*1.1;
    const nefes=Math.sin(u.faz*1.3)*.5+.5;
    d.govde.rotation.set(.02+nefes*.012,Math.sin(u.faz*.55)*.045,0);
    d.kalca.rotation.set(0,Math.sin(u.faz*.55)*-.03,0);
    d.kok.position.y=nefes*.006;
    d.bas.rotation.set(-.02,Math.sin(u.faz*.42)*.10,0);
    ["L","R"].forEach((a,i)=>{
      d["uyluk"+a].rotation.x=.02; d["baldir"+a].rotation.x=.05;
      d["ayak"+a].rotation.x=-.04;
      d["ustKol"+a].rotation.set(.04,0,(i?1:-1)*.06);
      d["onKol"+a].rotation.x=-.22-nefes*.03;
    });
    return;
  }
  u.faz+=dt*(kos?9.6:5.2)*u.salinim;
  const f=u.faz;
  const A=kos?.92:.54, K=kos?1.70:1.00, KOL=kos?.78:.42;
  ["L","R"].forEach((a,i)=>{
    const fa=f+(i?Math.PI:0), sx=i?1:-1;
    const uyluk=-Math.sin(fa)*A;
    /* diz yalnız öne savrulurken bükülür, geçiş anında tepe yapar */
    const diz=.06+K*Math.pow(Math.max(0,Math.cos(fa+.55)),1.4);
    d["uyluk"+a].rotation.x=uyluk;
    d["baldir"+a].rotation.x=diz;
    d["ayak"+a].rotation.x=-(uyluk+diz)*.55+Math.sin(fa+1.1)*(kos?.30:.16);
    d["ustKol"+a].rotation.x=Math.sin(fa)*KOL;     /* kollar bacakların tersi */
    d["ustKol"+a].rotation.z=sx*(kos?.16:.08);
    d["onKol"+a].rotation.x=-((kos?1.05:.30)+Math.max(0,Math.sin(fa))*(kos?.35:.28));
  });
  d.govde.rotation.x=kos?.20:.055;
  d.govde.rotation.y=Math.sin(f)*(kos?.17:.10);
  d.govde.rotation.z=Math.sin(f*2)*(kos?.05:.02);
  d.kalca.rotation.y=-Math.sin(f)*(kos?.13:.075);
  d.kalca.rotation.z=Math.sin(f)*(kos?.07:.04);
  d.kok.position.y=(kos?.075:.032)*(.5+.5*Math.cos(2*f))
                  +(kos?Math.max(0,Math.sin(f*2))*.03:0);
  d.bas.rotation.x=-d.govde.rotation.x*.7;
  d.bas.rotation.y=-d.govde.rotation.y*.45;
}

function aracKare(m,surer,dir,dt){
  const u=m.userData;
  if(!u.tekerler) return;
  const donus=surer?dt*(7.0/u.tekerR):0;
  for(let i=0;i<u.tekerler.length;i++) u.tekerler[i].teker.rotation.x+=donus;
  for(let i=0;i<u.onTekerler.length;i++) u.onTekerler[i].yuva.rotation.y=-dir*.55;
}

/* ═════════════ sahne ═════════════ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement,document.body.firstChild);

const sahne=new THREE.Scene();
sahne.background=new THREE.Color(0x0b0e17);
sahne.fog=new THREE.Fog(0x0b0e17,90,340);
const kamera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.15,800);
sahne.add(new THREE.HemisphereLight(0x9fb6d4,0x1a1d26,.66));
sahne.add(new THREE.AmbientLight(0xffffff,.20));
const gunes=new THREE.DirectionalLight(0xffe2b8,1.25);
gunes.position.set(26,38,18); gunes.castShadow=true;
gunes.shadow.mapSize.set(2048,2048);
gunes.shadow.camera.near=1; gunes.shadow.camera.far=280;
gunes.shadow.camera.left=-60; gunes.shadow.camera.right=60;
gunes.shadow.camera.top=60; gunes.shadow.camera.bottom=-60;
gunes.shadow.bias=-.0007; gunes.shadow.normalBias=.03;
sahne.add(gunes); sahne.add(gunes.target);
const dolgu=new THREE.DirectionalLight(0x7fa6d0,.34);
dolgu.position.set(-20,14,-16); sahne.add(dolgu);

const zeminDoku=(()=>{ const {c,x:g}=tuval(128,128);
  g.fillStyle="#161a24"; g.fillRect(0,0,128,128);
  g.strokeStyle="#222838"; g.lineWidth=2; g.strokeRect(0,0,128,128);
  return doku(c,70,70); })();
const zemin=new THREE.Mesh(new THREE.PlaneGeometry(900,900),
  new THREE.MeshStandardMaterial({map:zeminDoku,roughness:.98}));
zemin.rotation.x=-Math.PI/2; zemin.receiveShadow=true; sahne.add(zemin);

/* ═════════════ seri yönetimi ═════════════ */
const kok=new THREE.Group(); sahne.add(kok);
let tur="arac", seri=[], etkin=0, hepsiModu=false, doner=true, tohum=0;
let hareketMod="yuru", surusMod=false, direksiyon=0;
const SAYI={bina:BINA_TIP.length,arac:ARAC_SINIF.length,insan:8};
const $=id=>document.getElementById(id);

function temizle(){
  for(const m of seri){ kok.remove(m);
    m.traverse(o=>{ if(!o.isMesh) return;
      o.geometry.dispose();
      const ms=Array.isArray(o.material)?o.material:[o.material];
      for(const mm of ms){
        if(mm.map&&mm.map.dispose) mm.map.dispose();
        if(mm.emissiveMap&&mm.emissiveMap.dispose) mm.emissiveMap.dispose();
        mm.dispose(); } }); }
  seri=[];
}
function uret(yeniTohum){
  if(yeniTohum!==undefined) tohum=yeniTohum;
  tohumla(tohum+(tur==="bina"?1:tur==="arac"?2:3)*7919);
  temizle();
  for(let i=0;i<SAYI[tur];i++){
    const m = tur==="bina"?binaUret(BINA_TIP[i].id)
            : tur==="arac"?aracUret(ARAC_SINIF[i].id)
            : insanUret();
    seri.push(m); kok.add(m);
  }
  etkin=Math.min(etkin,seri.length-1);
  seritCiz(); yerlestir(); kunyeYaz();
  $("tohum").textContent="s3 · tohum "+tohum;
  $("hareket").classList.toggle("kapali",tur!=="insan");
  $("surus").classList.toggle("kapali",tur!=="arac");
  $("direksiyon").classList.toggle("kapali",tur!=="arac");
}
const adim=()=>tur==="bina"?46:(tur==="arac"?8:3.4);
function yerlestir(){
  if(hepsiModu){
    const n=seri.length, sut=Math.ceil(Math.sqrt(n)), a=adim();
    seri.forEach((m,i)=>{ const sx=i%sut, sz=Math.floor(i/sut);
      m.visible=true; m.rotation.y=0;
      m.position.set((sx-(sut-1)/2)*a,0,(sz-(Math.ceil(n/sut)-1)/2)*a); });
  } else seri.forEach((m,i)=>{ m.visible=(i===etkin); m.position.set(0,0,0); });
  kamerayiAyarla();
}
function kamerayiAyarla(){
  let cap,yuk;
  if(hepsiModu){
    const sut=Math.ceil(Math.sqrt(seri.length));
    cap=sut*adim();
    yuk=Math.max.apply(null,seri.map(m=>m.userData.yukseklik));
  } else { const m=seri[etkin]; if(!m) return;
    cap=m.userData.capi; yuk=m.userData.yukseklik; }
  /* Hem dikey hem yatay görüş açısına göre hesapla. Eskiden yalnız dikey
     alınıyordu; telefon dikeyken yatay alan çok daha dar olduğu için
     model ekrana sığmıyordu. */
  const dikFov=kamera.fov*Math.PI/180;
  const yatFov=2*Math.atan(Math.tan(dikFov/2)*kamera.aspect);
  const dDik=(yuk*1.18)/2/Math.tan(dikFov/2);
  const dYat=(cap*1.18)/2/Math.tan(yatFov/2);
  hedefUzak=Math.max(dDik,dYat)*1.22;
  hedefY=yuk*.45;
}
let hedefUzak=20, hedefY=3, uzak=30, merkezY=3, aci=.7, egim=.32;

function seritCiz(){
  const el=$("serit"); el.innerHTML="";
  seri.forEach((m,i)=>{
    const b=document.createElement("button");
    b.textContent=m.userData.ad;
    b.setAttribute("aria-pressed",String(i===etkin));
    b.onclick=()=>{ etkin=i; yerlestir(); seritCiz(); kunyeYaz(); };
    el.appendChild(b);
    if(i===etkin&&b.scrollIntoView) setTimeout(()=>{
      try{ b.scrollIntoView({block:"nearest",inline:"center"}); }catch(e){} },0);
  });
}
const turAdi=()=>tur==="bina"?"Bina":tur==="arac"?"Araç":"İnsan";
function kunyeYaz(){
  const m=seri[etkin]; if(!m) return;
  $("adi").textContent=hepsiModu?turAdi()+" serisi":m.userData.ad;
  const dl=$("kunyeler"); dl.innerHTML="";
  if(hepsiModu){ const d=document.createElement("dd");
    d.textContent=seri.length+" varyant, hepsi aynı tohumdan"; dl.appendChild(d); return; }
  for(const kv of m.userData.kunye){
    const dt=document.createElement("dt"); dt.textContent=kv[0];
    const dd=document.createElement("dd"); dd.textContent=kv[1];
    dl.appendChild(dt); dl.appendChild(dd);
  }
}

/* ═════════════ denetimler ═════════════ */
document.querySelectorAll("#turler button").forEach(b=>{
  b.onclick=()=>{ tur=b.dataset.tur; etkin=0;
    document.querySelectorAll("#turler button").forEach(x=>
      x.setAttribute("aria-pressed",String(x===b)));
    uret(); };
});
document.querySelectorAll("#hareket button").forEach(b=>{
  b.onclick=()=>{ hareketMod=b.dataset.mod;
    document.querySelectorAll("#hareket button").forEach(x=>
      x.setAttribute("aria-pressed",String(x===b))); };
});
document.querySelectorAll("#surus button").forEach(b=>{
  b.onclick=()=>{ surusMod=b.dataset.surus==="hareket";
    document.querySelectorAll("#surus button").forEach(x=>
      x.setAttribute("aria-pressed",String(x===b))); };
});
$("dirInput").oninput=function(){ direksiyon=this.value/100; };
$("yeniSeri").onclick=()=>uret((Math.random()*1e9)|0);
$("hepsi").onclick=function(){ hepsiModu=!hepsiModu;
  this.setAttribute("aria-pressed",String(hepsiModu));
  this.textContent=hepsiModu?"Tek tek göster":"Hepsini diz";
  yerlestir(); kunyeYaz(); };
$("dondur").onclick=function(){ doner=!doner;
  this.setAttribute("aria-pressed",String(doner));
  this.textContent=doner?"Dönüşü durdur":"Döndür"; };

let surukle=false, sonX=0, sonY=0, ikili=0, elle=0;
const tuvalEl=renderer.domElement;
tuvalEl.addEventListener("pointerdown",e=>{ surukle=true; sonX=e.clientX; sonY=e.clientY;
  tuvalEl.setPointerCapture(e.pointerId); });
tuvalEl.addEventListener("pointermove",e=>{ if(!surukle) return;
  aci-=(e.clientX-sonX)*.006; egim=kis(egim+(e.clientY-sonY)*.004,.04,1.15);
  sonX=e.clientX; sonY=e.clientY; elle=1.6; });
const bitir=()=>{ surukle=false; };
tuvalEl.addEventListener("pointerup",bitir);
tuvalEl.addEventListener("pointercancel",bitir);
tuvalEl.addEventListener("wheel",e=>{ e.preventDefault();
  hedefUzak=kis(hedefUzak*(1+Math.sign(e.deltaY)*.12),2,700); },{passive:false});
tuvalEl.addEventListener("touchmove",e=>{
  if(e.touches.length!==2) return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  if(ikili) hedefUzak=kis(hedefUzak*(ikili/d),2,700);
  ikili=d; },{passive:true});
tuvalEl.addEventListener("touchend",()=>{ ikili=0; });
addEventListener("keydown",e=>{
  if(!seri.length) return;
  if(e.key==="ArrowRight"){ etkin=(etkin+1)%seri.length; yerlestir(); seritCiz(); kunyeYaz(); }
  if(e.key==="ArrowLeft"){ etkin=(etkin-1+seri.length)%seri.length; yerlestir(); seritCiz(); kunyeYaz(); }
});
addEventListener("resize",()=>{
  kamera.aspect=innerWidth/innerHeight; kamera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); kamerayiAyarla(); });

/* ═════════════ döngü ═════════════ */
uret((Math.random()*1e9)|0);
yukleEl.classList.add("bitti");
setTimeout(()=>$("ipucu").classList.add("gizle"),5400);

let son=performance.now();
function kare(now){
  requestAnimationFrame(kare);
  const dt=Math.min((now-son)/1000,.05); son=now;
  if(elle>0) elle-=dt; else if(doner) aci+=dt*.26;

  for(const m of seri){
    if(!m.visible) continue;
    if(m.userData.tur==="insan") insanKare(m,hareketMod,dt);
    else if(m.userData.tur==="arac") aracKare(m,surusMod,direksiyon,dt);
  }

  uzak+=(hedefUzak-uzak)*Math.min(1,4*dt);
  merkezY+=(hedefY-merkezY)*Math.min(1,4*dt);
  const yc=Math.cos(egim);
  kamera.position.set(Math.sin(aci)*yc*uzak,merkezY+Math.sin(egim)*uzak,Math.cos(aci)*yc*uzak);
  kamera.lookAt(0,merkezY,0);
  gunes.target.position.set(0,merkezY,0); gunes.target.updateMatrixWorld();
  gunes.position.set(26,38+merkezY,18);
  renderer.render(sahne,kamera);
}
requestAnimationFrame(kare);
})();
</script>
